services:
  postgres-test:
    image: postgres:15
    environment:
      POSTGRES_DB: trading_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - 5433:5432
    volumes:
      - ./test/sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  influxdb-test:
    image: influxdb:2.0
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: test_user
      DOCKER_INFLUXDB_INIT_PASSWORD: test_password
      DOCKER_INFLUXDB_INIT_ORG: test_org
      DOCKER_INFLUXDB_INIT_BUCKET: test_bucket
    ports:
      - 8087:8086

  redis-test:
    image: redis:7-alpine
    ports:
      - 6380:6379

  mock-exchange:
    build:
      context: ./test/mock_exchange
    ports:
      - 8080:8080
      - 8081:8081
